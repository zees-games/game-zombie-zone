# Weapon and supply spawners (dot-weapon docs/spawners.md). A map document lists the places in
# `spawners:`; this file says what they give. The operator overrides in cfg/server/game/game-zombie-zone/dot_weapon/.
default_pool: wall_guns

# Every pool has a `channel` (where it is offered); the weapons.not_in / weapons.weights keys of
# cfg/addons/zombie_zone/packs.yml are applied per channel: spawner, wall, crate, trader.
pools:
  wall_guns:
    channel: wall
    kind: weapon
    catalogue:
      tags_any: [sidearm, primary]
      tags_none: [heavy, melee, thrown]
      weight: 1
  field_guns:
    channel: spawner
    kind: weapon
    catalogue:
      tags_any: [sidearm, primary]
      tags_none: [heavy, melee, thrown]
      weight: 1
  heavy_guns:
    channel: spawner
    kind: weapon
    catalogue:
      tags_any: [heavy]
      weight: 1
  throwables:
    channel: spawner
    kind: throwable
    catalogue:
      tags_any: [thrown]
      weight: 1
  crate:
    channel: crate
    kind: weapon
    catalogue:
      tags_any: [sidearm, primary, heavy]
      tags_none: [melee, thrown]
      weight: 1
  supplies:
    channel: spawner
    kind: medkit
    entries:
      - id: medkit
        kind: medkit
        weight: 3
      - id: pills
        kind: pills
        weight: 4
  ammo:
    channel: spawner
    kind: ammo
    entries:
      - id: ammo
        kind: ammo
        weight: 1
  trader_stock:
    channel: trader
    kind: weapon
    catalogue:
      tags_any: [sidearm, primary, heavy, thrown]
      tags_none: [melee]
      weight: 1
      weights:
        zz_pistol: 0.5
    entries:
      - id: medkit
        kind: medkit
        weight: 1.5
        data:
          price: 150
      - id: pills
        kind: pills
        weight: 1.5
        data:
          price: 75
      - id: ammo
        kind: ammo
        weight: 1
        data:
          price: 100

# What the converter's weapon_*, item_* and ammo_* entities become (first match wins; a map's own
# pickups come from its world manifest). Everything here is free to take, and comes back after `respawn`.
classes:
  "weapon_*grenade*":
    pool: throwables
    respawn: 120
    group: throwables
  "weapon_*":
    pool: field_guns
    respawn: 90
    group: field_guns
  "item_health*":
    pool: supplies
    respawn: 120
  "item_*ammo*":
    pool: ammo
    respawn: 60
  "ammo_*":
    pool: ammo
    respawn: 60
  "item_*":
    pool: supplies
    respawn: 120

groups:
  field_guns: 8
  throwables: 4

# Defaults by spawner id, over what the map says.
sites:
  heavy:
    pool: heavy_guns
    respawn: 180
    max: 1
  supplies:
    pool: supplies
    respawn: 90
    max: 1
  throwables:
    pool: throwables
    respawn: 60
    max: 1

# The shop. A spawner whose `data` has `price: N` sells its item for N points (the wall-buy: a site
# with a fixed `item` and `respawn: 0`); `tier_price: true` takes the weapon's tier price below.
# A map says so in its `spawners:`: {id: wall1, at: [...], item: shotgun, respawn: 0, data: {price: 300}}
# or {id: crate, at: [...], pool: wall_guns, respawn: 0, data: {tier_price: true}}.
# Per map, add `maps:` with a block per map id or glob, e.g. zm_lot: then game: shop: prices: ...
game:
  shop:
    # The trader at the start. Override in cfg/server/game/game-zombie-zone/dot_weapon/spawner.yml, or live with
    # the cvars zz_trader, zz_trader_when, zz_trader_despawn, zz_start_points (-1 reads this file); docs/operators.md.
    enabled: true            # false: no trader on any map
    available: waves         # setup (before the horde runs) | waves (setup and a survival map's breathers) | always (also during a round)
    despawn: true            # true: the shelf is gone while closed; false: it stands there and says "closed"
    fallback: true           # a map with no trader of its own gets one just ahead of the first survivor spawn
    fallback_distance: 3.0   # metres ahead of that spawn
    # Points every survivor starts a map with (a balance above it is kept). A number, or a table: `default`,
    # a key per difficulty (easy, normal, advanced, expert) and a key per mode (exodus, survival); the mode wins.
    start_points:
      default: 0
      easy: 400
      normal: 250
      advanced: 150
      expert: 0
    # The trader's menu (E within `radius` metres of the trader while it is open; Esc or walking away closes it).
    menu: true               # false: only the ground shelf
    radius: 3.5              # metres
    price_multiplier: 1.0    # every price below, after the overrides
    # The tabs, in order; leave one out to remove it.
    categories:
      - weapons
      - grenades
      - ammo
      - supplies
      - entities
    # Item ids kept off the list (a weapon id, mag:<id>, refill:<id>, refill_all, medkit, pills, heal, armour, box:<type>).
    # disabled:
    #   - armour
    # Per item, a price (shotgun: 300) or nested keys price and enabled (enabled: false removes it).
    # Dearer or cheaper than the tier's price (sidearm 50, primary 250, heavy 600, thrown 75).
    items:
      zz_revolver: 150
      zz_mp5: 220
      zz_spas: 320
      zz_dmr: 450
      zz_lmg: 900
      zz_m79: 750
    ammo:
      magazine_share: 0.08   # a magazine costs this share of the gun's price (at least 5)
      refill_share: 0.2      # a refill to the cap costs this share (at least 10)
      refill_all: 150        # every carried gun
    supplies:
      medkit: 150
      pills: 50
      heal: 100
      armour: 200
      armour_amount: 50
    boxes:                   # box types (boxes/boxes.json ids) sold as carried boxes; a type that does not exist is not listed
      medical: 250
      arsenal: 400
      turret: 500
    prices:
      sidearm: 50
      primary: 250
      heavy: 600
      thrown: 75
  # Traders: a shelf of priced stock rolled from a pool. Defaults here; a map lists its own in its
  # document's `traders:` or per map below. A bought slot comes back after `restock` seconds (0 never).
  trader:
    pool: trader_stock
    slots: 4
    spacing: 0.9
    restock: 0

# Per-map blocks, by map id or glob (the more literal characters win, a map's own block last).
# Themes: "ze_*" escapes, "zm_*" and "zs_*" survival; horror maps (dark, short on supplies) and city
# maps (open, plenty of guns) carry their class overrides in their own block, since a glob has no
# alternatives. Then one block per shipped world map: a field gun, and on a survival map a trader and
# a crate, placed at that map's own survivor spawns so no map file is touched. A map with no block
# plays the defaults above.
maps:
  "ze_*":
    classes:
      "weapon_*grenade*":
        pool: throwables
        respawn: 180
        group: throwables
      "weapon_*":
        pool: field_guns
        respawn: 240
        group: field_guns
    game:
      shop:
        prices:
          primary: 200
          heavy: 500
  "zm_*":
    game:
      trader:
        slots: 5
        restock: 150
  "zs_*":
    game:
      trader:
        slots: 4
        restock: 180
