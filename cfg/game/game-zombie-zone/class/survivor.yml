# The survivor class (dot-player-class). A number left out, or -1, keeps the ZzConfig value (zz_run_speed, zz_sprint_*, zz_stamina_*, zz_weight_limit).
# An operator overrides in cfg/server/game/game-zombie-zone/class/survivor.yml; the change lands on the next spawn.
# Run speed multiplier [0.05..10]
# speed: 1.0
# Walk (Alt) multiplier on the run speed [0..1]
# walk_speed_scale: 0.45
# Sprint multiplier on the run speed [1..3]
# sprint_speed_scale: 1.22
# Crouch multiplier on the run speed [0..1]
# crouch_speed_scale: 0.45
# Stamina a second (1.0 is a full bar): drain while sprinting, recovery at rest
# stamina_drain: 0.2
# stamina_recover: 0.15
# Fraction of the bar needed to sprint again, and seconds of delay once spent
# stamina_resume_at: 0.3
# stamina_exhaust_delay: 1.5
# Carry capacity in kilograms [0..1000]
# carry_limit: 14.0
