  per_player: 4
growth:
  linear: 0.22
  accel: 0.018
pool:
  common: 10
  crawler: 2
director:
  skill: true
  specials_budget: 2
difficulty:
  easy:
    size: 0.7
    health: 0.8
    speed: 0.95
    reward: 1.2
  hard:
    size: 1.3
    health: 1.2
    speed: 1.1
    reward: 0.9
waves:
  "2-10":
    specials:
      spitter: 1
  "5":
    boss:
      npc: brute
      count: 1
      at: 0.33
  last:
    boss:
      npc: brute
      count: 2
      at: 0.33
extra:
