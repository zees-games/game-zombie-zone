# What a dead zombie leaves: ammunition and health. Every default lives in game/zz_drops.gd (DEFAULTS);
# this file only names the keys. ALL .yml files here are read in name order, then cfg/game/game-zombie-zone/zombie_zone/,
# then the operator's cfg/server/addons/zombie_zone/ and cfg/server/game/game-zombie-zone/zombie_zone/.
# Keep a server's changes in its own file (cfg/server/addons/zombie_zone/90-drops.yml).
drops:
  # enabled: true            # false: nothing is dropped (boxes are separate: zz_box_drops)
  # multiplier: 1.0          # times every chance; 2.0 is twice the drops, 0 none (above 1 a kill can drop twice)
  # despawn_seconds: 90      # how long a drop lies; 0 forever
  # max_lying: 40            # the most drops on the ground; the oldest goes first
  # categories: {ammo: 1.0, health: 1.0}         # the global category weights
  # items: {ammo: 1.0, pills: 1.0, medkit: 0.0}  # the global item weights (an item's draw = category x item)
  # ammo_fraction: 0.25      # share of every pool's cap one ammo drop gives
  # classes:
  #   common: {chance: 0.16, min: 1, max: 1}      # chance per kill; min/max pickups per drop
  #   mutant: {chance: 0.5, min: 1, max: 2, categories: {ammo: 1.0, health: 1.0}, items: {medkit: 0.25}}
  # types:                   # one zombie type over its class: leaper strangler bloater ram spitter rider screamer crawler riot brute sleeper (or a pack's monster id)
  #   riot: {chance: 0.7, min: 2, max: 2, categories: {ammo: 1.5}}
