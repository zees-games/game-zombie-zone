# Optional content packs (zz-modern-weapons, zz-medieval-weapons, zz-historical-monsters, or any
# addon with a spawn_provider.gd). ALL .yml files in this directory are read, in name order, a
# later file winning; keep a server's changes in its own file (e.g. 90-server.yml).
weapons:
  legacy: false      # true brings zee-dot-weapons' original blasters and tools (pistol, rifle, launcher, ...) back into every pool, the shop and the kits; the modern pack is the default set
  enabled: true      # installed weapons join boxes, loot, the buy pool and the stand-ins' kits
  exclude: []        # weapon ids to keep out of the pool
  min_wave:          # first survival wave that lays the weapon out (heavy and drum-fed guns come late); exodus maps are not gated
    zz_deagle: 2
    zz_p90: 2
    zz_hunting: 3
    zz_scar: 3
    zz_dmr: 4
    zz_aa12: 4
    zz_bren: 4
    zz_vss: 4
    zz_sniper: 5
    zz_lmg: 5
    zz_m79: 5
    zz_frag: 5
    zz_rpg: 7
  # rating:          # id: a stand-in's idea of a gun's worth, over damage a second worked out from its stats
  weights:           # id: draw weight in boxes, loot and caches (default 1; 0 is never drawn there, still given by name)
    zz_bat: 2.0
    zz_crowbar: 2.0
    zz_machete: 1.5
    zz_knife: 1.5
    zz_axe: 1.2
    zz_sledge: 0.7
    zz_pistol: 2.0
    zz_glock: 2.0
    zz_revolver: 1.2
    zz_shotgun: 1.2
    zz_hunting: 0.8
    zz_deagle: 0.6
    zz_dmr: 0.5
    zz_vss: 0.4
    zz_sniper: 0.3
    zz_bren: 0.5
    zz_aa12: 0.5
    zz_lmg: 0.4
    zz_frag: 0.5
    zz_m79: 0.3
    zz_rpg: 0.2
  # tiers:           # id: sidearm | primary | heavy | melee | thrown, over what the pack tags
  #   zz_vss: heavy
  # not_in:          # channel -> ids kept out of that channel only. Channels: box, loot, cache (the drops),
  #                  # spawner (weapons the map lays), wall (wall-buys), crate (map crates), trader (the shelf)
  #   box: [zz_knife]
  #   trader: [zz_sniper]
monsters:
  enabled: true
  weight: 1.0        # an installed monster's weight as a special; each built-in kind weighs 1.0
  # weights:          # id: weight under here (indented), over the default above; 0 drops that monster
  #   some_monster: 0
  # min_wave:        # id: first survival wave that may send it (default 1)
  #   zhm_trex: 6
  boss: []           # ids sent in place of the brute instead of as specials
  boss_chance: 0.4   # chance a brute's turn goes to an installed boss, when there is one
