# Aiming down sights (ZeeAdsRules). Override on a server in cfg/server/addons/zee_weapons/ads.yml.
# view_scale multiplies the gun's hip size, view_shift_* moves it (metres, view space); zoom is a field-of-view multiplier, 0 takes the art.
# Default 1.0: the modern pack's guns carry their own hip size and hold (their weapon profile `extra: view:`).
# The zed pack's guns are modelled at real size, so they take 0.9 to 1.15 where zee's toy blasters take 1.5.
ads:
  default:
    enabled: true
    aim_time: 0.0
    zoom: 0.0
    move_speed_multiplier: 0.8
    spread_multiplier: 0.6
    sway_multiplier: 0.5
    toggle: false
    view_scale: 1.0
    view_shift_x: 0.0
    view_shift_y: 0.0
    view_shift_z: 0.0
# A weapon override lists only what it changes, by weapon id:
  weapons:
    sniper:
      view_scale: 1.4
    pistol:
      view_scale: 1.2
      view_shift_x: -0.02
    revolver:
      view_scale: 1.2
      view_shift_x: -0.02
    machine_pistol:
      view_scale: 1.2
      view_shift_x: -0.02
    derringer:
      view_scale: 1.2
      view_shift_x: -0.02
    service_pistol:
      view_scale: 1.0
      view_shift_x: -0.02
    silenced_pistol:
      view_scale: 0.95
      view_shift_x: -0.02
    uzi:
      view_scale: 1.1
    tactical_smg:
      view_scale: 1.1
    pump_shotgun:
      view_scale: 1.1
    sawed_off:
      view_scale: 1.1
    hunting_rifle:
      view_scale: 1.1
    machine_gun:
      view_scale: 1.05
    grenade_launcher:
      view_scale: 1.05
    rocket_launcher:
      view_scale: 0.95
    flamethrower:
      view_scale: 1.15
    molotov:
      view_scale: 1.0
    pipe_bomb:
      view_scale: 1.0
    bile_jar:
      view_scale: 0.9
