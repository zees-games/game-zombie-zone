# Every script parses, then every suite runs. The whole check is in modcommunity/dot-ci,
# so that fixing it is one commit rather than one per repository; its README says what
# the inputs are and why a release does not touch the content origin.
#
# branches: ['**'] rather than [main] on purpose. Several repositories in this family
# sit on a task branch for days, and a main-only trigger is a check that reports
# nothing about the work anybody is actually doing -- the same assumption that made
# push-github.sh push a stale ref, succeed, and send nothing.
name: CI

on:
    push:
        branches: ['**']
        paths-ignore:
            - '**/*.md'
            - 'screenshots/**'
    pull_request:
    workflow_dispatch:

# Two workflows (this and ci-rest.yml) because dot-ci's validate job is capped at 30 minutes and the suites take about 33; one workflow
# would share a concurrency group and cancel itself. A suite added to examples/ goes in one of the two lists.
jobs:
    validate:
        uses: modcommunity/dot-ci/.github/workflows/validate.yml@v1
        with:
            suite-timeout: 900
            profiles: true
            suites: >-
                examples/headless_ambience examples/headless_arsenal examples/headless_buildonce examples/headless_carry examples/headless_propforce examples/headless_propcarry
                examples/headless_classes examples/headless_collide examples/headless_config examples/headless_consumables
                examples/headless_defib examples/headless_downed examples/headless_gait examples/headless_slide examples/headless_grenades
                examples/headless_hazards examples/headless_look examples/headless_mapcfg examples/headless_maps
                examples/headless_mechanics examples/headless_mutant examples/headless_nav examples/headless_net
        secrets:
            DEPS_TOKEN: ${{ secrets.DOT_DEPS_TOKEN }}
