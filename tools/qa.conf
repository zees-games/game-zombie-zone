# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
# Baselines are pinned to one GPU box: a perf number is only comparable on the card it was taken on.
# A case is a map id, or map@zombies: zz_high_school@120 is the wave-7 crowd a solo host reported at 40 fps.
PERF_CASES=zm_abandoned_mall,zm_4way_tunnel,zz_high_school@120,ze_boat_escape
PERF_SECONDS=20
PERF_METRICS="p50_ms:3:100 p95_ms:5:125 p99_ms:6:150 stall_ms:15:300 load_s:2:40 rss_mb:100:4000 phys_ms:2:60 draws:150:4000"

perf_run_case() {
    local map=${1%@*} zombies=56
    [[ $1 == *@* ]] && zombies=${1#*@}
    GPU_BOX="${GPU_BOX:-staging}" GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh shot "$GAME" tools/shot_bench.sh \
        --zz-map-ids="$map" --zombies="$zombies" --measure="$2"
}

VISUAL_CASES="zm_abandoned_mall"
VISUAL_SHOTS="overview survivor"

visual_render() {
    for shot in $VISUAL_SHOTS; do
        GPU_BOX="${GPU_BOX:-staging}" heavy -- timeout 300 tools/shot.sh --view="$shot" --zz-map-ids="$1" --name="${1}_${shot}" \
            --out="res://screenshots/${1}_${shot}.png" || return 1
    done
}

# capture_reviews.sh (dot-game/tools): the scripted filmstrip clips as nightly /reviews clips.
review_items() { python3 -c "import json;print('\n'.join(c['name'] for c in json.load(open('tools/filmstrip_scenarios.json'))['clips']))"; }

review_fingerprint() {
    python3 -c "import json,sys;print(json.dumps([c for c in json.load(open('tools/filmstrip_scenarios.json'))['clips'] if c['name']==sys.argv[1]]))" "$1"
    cat tools/filmstrip_capture.gd game/zz_anim*.gd game/zz_*gait*.gd 2>/dev/null
}

review_capture() {
    local out=$1 it f kind; shift
    for it in "$@"; do
        FPS=${FPS:-20} GPU_SHOT_WAIT=${GPU_SHOT_WAIT:-1500} tools/filmstrip.sh "$it" || continue
        for f in screenshots/filmstrip/"$it".mp4 screenshots/filmstrip/"$it"_*.mp4; do
            [[ -f $f ]] || continue
            kind=${f##*/}; kind=${kind%.mp4}; kind=${kind#"$it"}; kind=${kind#_}; kind=${kind:-clip}
            cp "$f" "$out/${it}__${kind}.mp4"
        done
    done
}

review_look() { echo "Feet plant without sliding, the body has no bone pops, and the loop returns to the start pose without a jump."; }
